<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1F4D" />
  <meta name="referrer" content="no-referrer" />
  <title>みずほ銀行</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page" id="page">
    <header class="brand" aria-label="MIZUHO">
      <div class="logo-word">MIZUHO</div>
      <div class="logo-swoosh" aria-hidden="true"></div>
    </header>

    <section class="pin-area">
      <p class="hint">アプリパスワードを入力してください</p>
      <div class="pin-slots" id="pinSlots" aria-label="アプリパスワード"></div>
    </section>

    <section class="footer">
      <div class="keypad" id="keypad" aria-label="数字キーパッド"></div>
      <button type="button" class="cancel-btn" id="cancelBtn">キャンセル</button>
    </section>
  </div>
  <script src="./js/main.js"></script>
</body>
</html>
