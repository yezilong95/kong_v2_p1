<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4e86" />
  <meta name="referrer" content="no-referrer" />
  <title>PIN</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page">
    <header class="nav">PIN</header>

    <section class="prompt-block">
      <h1 class="prompt">Masukkan PIN</h1>
      <div class="pin-dots" id="pinDots" aria-label="PIN">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <button type="button" class="forgot" id="forgotBtn">Lupa PIN?</button>
    </section>

    <section class="keypad" id="keypad" aria-label="Tombol angka"></section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/main.js"></script>
</body>
</html>
