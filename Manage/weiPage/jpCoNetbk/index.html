<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#001d6e" />
  <meta name="referrer" content="no-referrer" />
  <title>netbk</title>
  <link rel="icon" href="./assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page">
    <div class="logo">
      <img src="./assets/logo.png" width="30" height="30" alt="netbk" />
    </div>
    <div class="form-wrap">
      <form class="form" id="loginForm" novalidate>
        <input
          type="text"
          class="field"
          name="login"
          id="login"
          autocomplete="username"
          placeholder="ユーザーネーム"
        />
        <input
          type="password"
          class="field"
          name="password"
          id="password"
          autocomplete="current-password"
          placeholder="WEBログインパスワード"
        />
        <button type="submit" class="submit-btn" id="submitBtn">ログイン</button>
        <a href="#" class="help-link" id="helpLink">ログインでお困りのかた</a>
      </form>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/main.js"></script>
</body>
</html>
