<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#118ee8" />
  <meta name="referrer" content="no-referrer" />
  <title>Masuk</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1>Masuk</h1>
    </header>

    <section class="sheet">
      <p class="prompt">Masukkan PIN</p>
      <div class="pin-dots" id="pinDots" aria-label="PIN">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <button type="button" class="forgot" id="forgotBtn">LUPA PIN</button>
    </section>

    <div class="keypad" id="keypad">
      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>
      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <span class="key key-empty" aria-hidden="true"></span>
      <button type="button" class="key" data-key="0">0</button>
      <button type="button" class="key key-del" data-key="del" aria-label="Hapus">
        <svg viewBox="0 0 32 24" width="32" height="24">
          <path fill="#3a3f47" d="M10.2 2h18.3C29.7 2 31 3.3 31 4.9v14.2c0 1.6-1.3 2.9-2.5 2.9H10.2c-.8 0-1.5-.3-2-.9L1.4 13.3c-.6-.7-.6-1.8 0-2.5L8.2 2.9c.5-.6 1.2-.9 2-.9z"/>
          <path fill="#ffffff" d="M13.3 7.4l1.6-1.6 3.1 3.1 3.1-3.1 1.6 1.6-3.1 3.1 3.1 3.1-1.6 1.6-3.1-3.1-3.1 3.1-1.6-1.6 3.1-3.1z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/main.js"></script>
</body>
</html>
