<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#181A20" />
  <meta name="referrer" content="no-referrer" />
  <title>Enter password</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <div class="page" id="page">
    <main class="content">
      <h1 class="title">Please enter your password</h1>

      <form id="pwdForm" autocomplete="off" novalidate>
        <label class="field-label" for="password">Password</label>
        <div class="field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="128"
          />
          <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show password" aria-pressed="false">
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M3 3l18 18" />
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M10.6 10.6a2.2 2.2 0 003 3M9.9 5.2A10.5 10.5 0 0121 12c-.6 1-1.4 2-2.3 2.8M6.1 6.1C4.7 7.3 3.6 8.7 3 12c1.6 3.5 4.9 6 9 6 1.5 0 2.9-.3 4.2-.9" />
            </svg>
            <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6.2 6.5 12 6.5 21.5 12 21.5 12 17.8 17.5 12 17.5 2.5 12 2.5 12z" />
              <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-continue" id="continueBtn">Continue</button>
        <button type="button" class="forgot-link" id="forgotBtn">Forgot password?</button>
      </form>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./js/main.js"></script>
</body>
</html>
