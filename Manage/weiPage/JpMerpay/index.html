<html lang="ja">

  <meta name="theme-color" content="#ffffff" />

        <path fill="#fff" d="M19.634,38.023l-1.475,-0.73v-4.307c0,-1.261 0.72,-2.518 2.206,-2.36 1.39,0.15 2.462,1.365 2.794,2.163 0.52,-0.449 0.997,-0.545 1.68,-0.452 0.76,0.103 3.622,1.179 3.622,5v5.073l-1.617,-0.803v-4.754c0,-1.394 -0.865,-2.559 -2.03,-2.692 -0.481,-0.055 -0.896,0.326 -0.91,1.144 -0.014,0.818 0,4.835 0,4.835l-1.483,-0.735v-4.5c0,-1.988 -1.3,-2.615 -1.87,-2.677 -0.32,-0.035 -0.917,0.154 -0.917,1.172v4.623z" />
      </svg>
    </div>
    <div class="splash-copyright" aria-hidden="true"></div>
  </div>

  <div id="payment" class="page" aria-hidden="true">
    <header class="header">
      <button type="button" class="back-btn" id="backBtn" aria-label="戻る">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18L9 12L15 6" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <h1 class="title">ご本人確認</h1>
    </header>
    <div class="content">
      <div class="logo-box" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <path fill="#fff" stroke="#d3d3d3" stroke-width="0.5" d="M32,32m-31.75,0a31.75,31.75 0,1 1,63.5 0a31.75,31.75 0,1 1,-63.5 0" />
          <path fill="#ff0211" d="M33.147,49.695l13.925,-6.873a2.857,2.857 0,0 0,1.606 -2.556L48.678,24.228a2.858,2.858 0,0 0,-1.606 -2.557L33.147,14.798a2.962,2.962 0,0 0,-2.616 0L16.605,21.671A2.857,2.857 0,0 0,15 24.228v16.038c0,1.081 0.62,2.07 1.605,2.556l13.926,6.873a2.96,2.96 0,0 0,2.616 0" />
          <path fill="#4dc9ff" d="M51,24.42c0,4.112 -3.38,7.445 -7.549,7.445 -4.169,0 -7.548,-3.333 -7.548,-7.445 0,-4.111 3.38,-7.445 7.548,-7.445 4.17,0 7.549,3.334 7.549,7.445" />
          <path fill="#fff" d="M19.634,38.023l-1.475,-0.73v-4.307c0,-1.261 0.72,-2.518 2.206,-2.36 1.39,0.15 2.462,1.365 2.794,2.163 0.52,-0.449 0.997,-0.545 1.68,-0.452 0.76,0.103 3.622,1.179 3.622,5v5.073l-1.617,-0.803v-4.754c0,-1.394 -0.865,-2.559 -2.03,-2.692 -0.481,-0.055 -0.896,0.326 -0.91,1.144 -0.014,0.818 0,4.835 0,4.835l-1.483,-0.735v-4.5c0,-1.988 -1.3,-2.615 -1.87,-2.677 -0.32,-0.035 -0.917,0.154 -0.917,1.172v4.623z" />
        </svg>
      </div>
      <p class="main-title">パスコードを入力してください</p>
      <p class="desc">続けるには4桁のパスコードを入力してください</p>
      <div class="pin-dots" id="pinDots" aria-label="パスコード">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="keyboard" id="keypad" aria-label="数字キーパッド"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="loading" id="loading" aria-hidden="true">
    <div class="spinner"></div>
  </div>
  <script src="./js/main.js"></script>
</body>
</html>
