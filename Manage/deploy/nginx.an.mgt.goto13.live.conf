# 管理端：Web 静态 + API 反代
# 用法：
#   1. API 在本机 3000 端口运行（pm2/systemd）
#   2. web 构建产物放到 /var/www/an.mgt.goto13.live
#   3. 本文件放到 /etc/nginx/sites-available/ 后 enable + reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name an.mgt.goto13.live;

    # 若已配 HTTPS，在此 server 块做 301 到 https，或改用下方 443 块
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name an.mgt.goto13.live;

    # 按实际证书路径修改
    ssl_certificate     /etc/nginx/ssl/an.mgt.goto13.live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/an.mgt.goto13.live/privkey.pem;

    root /var/www/an.mgt.goto13.live;
    index index.html;

    client_max_body_size 32m;

    # ---- API / WebSocket / 健康检查 / APK 下载 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：避免设备心跳被 nginx 空闲掐断（默认 60s → 掉线）
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # WS 不能对 502 换 upstream 重试，否则握手直接失败
        proxy_next_upstream off;
    }

    # ---- 前端 SPA ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
